name: SwiftUIStructure
options:
  bundleIdPrefix: mengchea.SwiftUIStructure
targets:
  SwiftUIStructure:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      # XcodeGen will automatically scan these folders and add any new files it finds!
      - path: SwiftUIStructure
      - path: Data
      - path: Domain
      - path: DataSource
      - path: Repository
      - path: UseCase
      - path: DI
      - path: Presentation
    settings:
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
